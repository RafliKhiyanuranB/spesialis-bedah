<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <h2>Form Summary</h2>

  <form id="summaryForm">
    <div class="form-section">

      <div class="form-group">
        <label for="groupName">Nama Kelompok Pengirim Summary:</label>
        <input type="text" id="groupName" name="groupName" placeholder="Masukkan Nama Kelompok">
        <span class="error" id="groupNameError"></span>
      </div>

      <div class="form-group">
        <label for="memberCount">Jumlah Anggota Kelompok:</label>
        <input type="text" id="memberCount" name="memberCount" placeholder="Masukkan Jumlah Anggota">
        <span class="error" id="memberCountError"></span>
      </div>

      <div class="form-group">
        <label for="websiteTitle">Judul Website:</label>
        <input type="text" id="websiteTitle" name="websiteTitle" placeholder="Masukkan Judul Website">
        <span class="error" id="websiteTitleError"></span>
      </div>

      <div class="form-group">
        <label for="supervisorName">Nama Asisten/Supervisor:</label>
        <input type="text" id="supervisorName" name="supervisorName" placeholder="Masukkan Nama Supervisor">
        <span class="error" id="supervisorNameError"></span>
      </div>

      <div class="form-group">
        <label for="description">Deskripsi Website TA:</label>
        <input type="text" id="description" name="description" placeholder="Masukkan Deskripsi">
        <span class="error" id="descriptionError"></span>
      </div>

      <div class="form-group">
        <label for="progress">Capaian Hasil Pekerjaan:</label>
        <input type="text" id="progress" name="progress" placeholder="Masukkan Pencapaian">
        <span class="error" id="progressError"></span>
      </div>

      <div class="form-group">
        <label for="problems">Permasalahan yang Dihadapi:</label>
        <input type="text" id="problems" name="problems" placeholder="Masukkan Permasalahan">
        <span class="error" id="problemsError"></span>
      </div>

      <button type="submit" class="submit-btn">Kirim Formulir</button>

    </div>
  </form>

  <script src="js/summary.js"></script>
</body>
</html>
